plugins {
	id 'net.fabricmc.fabric-loom' version '1.19.4'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://www.cursemaven.com" }
	maven { url "https://maven.willbl.dev/releases" }
	maven { url 'https://jitpack.io' }
	maven { url "https://maven.terraformersmc.com/" }
	maven { url "https://api.modrinth.com/maven" }
	maven { url 'https://maven.cafeteria.dev' }
	maven { url 'https://maven.blamejared.com' }
}

sourceSets {
	main {
		java {
			exclude 'net/environmentz/compat/EnvironmentzEmiPlugin.java'
			exclude 'net/environmentz/compat/EnvironmentEmiAnvilRecipe.java'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Cloth
	implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	// Modmenu
	compileOnly runtimeOnly("com.terraformersmc:modmenu:${project.mod_menu_version}"),{
		exclude(group: "net.fabricmc.fabric-api")
	}
	// Dehydration
	compileOnly ("maven.modrinth:dehydration:${project.dehydration_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	// REI
	compileOnly "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
	// JEI
	compileOnly "mezz.jei:jei-26.3-common-api:${project.jei_version}"
	compileOnly "mezz.jei:jei-26.3-fabric-api:${project.jei_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version, "fabric_version": project.fabric_version, "loader_version": project.loader_version, "minecraft_version": project.minecraft_version, "cloth_config_version": project.cloth_config_version
	}
}

java {
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
